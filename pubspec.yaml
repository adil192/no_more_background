name: no_more_background
description: "Stop Android apps running in the background"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.1.1+201010

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  ini: ^2.1.0
  material_symbols_icons: ^4.2892.0
  mutex: ^3.1.0
  package_info_plus: ^9.0.0
  platform_linux: ^0.1.2+1
  shizuku_api: ^1.2.2
  stow_codecs: ^1.4.0
  stow_plain: ^0.6.0
  super_context_menu: ^0.9.1
  url_launcher: ^6.3.2
  yaru: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  golden_screenshot: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - LICENSE.md
    - assets/icon/icon.png
    - assets/Delta-Icons-License.txt
    - submodules/Delta-Icons/app/src/main/assets/appfilter.xml
    - submodules/Delta-Icons/app/src/main/res/drawable-nodpi/
    - submodules/lawnicons/app/assets/appfilter.xml
    - submodules/lawnicons/LICENSE
    - submodules/lineage_wiki/licenses/LICENSE
    - submodules/lineage_wiki/images/devices/small/

# ./scripts/generate_icons.sh
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  adaptive_icon_background: "assets/icon/icon_android_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_android_fg.png"
  adaptive_icon_monochrome: "assets/icon/icon_android_mono.png"

  windows:
    generate: true
    icon_size: 256
